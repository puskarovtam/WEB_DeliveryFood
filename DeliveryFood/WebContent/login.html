    <div class="container">
        <div class="d-flex justify-content-center align-items-center min-vh-100">
            <form id="formLogin" class="form-horizontal col-12">
                <div class="form-group row">
                    <label for="username" class="col-sm-4 col-form-label"
                        style="text-align: right; font-weight: bold;">Username:</label>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" name="usernameLogin" id="usernameLogin"
                            placeholder="Upišite Vaš username" />
                    </div>
                </div>
                <div class="form-group row">
                    <label for="password" class="col-sm-4 col-form-label"
                        style="text-align: right; font-weight: bold;">Password:</label>
                    <div class="col-sm-4">
                        <input type="password" class="form-control" name="passwordLogin" id="passwordLogin"
                            placeholder="Upišite Vaš password" />
                    </div>
                </div>
                <div class="form-group">
                    <div class="offset-sm-4 col-sm-4">
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                    </div>
                </div>
                <div class="form-group">
                    <div class="offset-sm-4 col-sm-4">
                        <a href="index.html" type="submit" id="cancelButton" class="btn btn-info btn-block">Odustani</a>
                    </div>
                </div>
                <div class="form-group">
                    <div class="offset-sm-4 col-sm-4 text-center">
                        <a href="register.html">Nemate nalog? Registrujte se ovde.</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
