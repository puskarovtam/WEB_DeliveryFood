<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="js/auth.js"></script>

    <script type="text/javascript"
        src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-validator/0.5.3/js/bootstrapValidator.min.js"></script>

    <title>Delivery 4 U</title>
</head>

<body>
    <nav class="navbar navbar-inverse">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#myNavbar">
                    <span class="icon-bar"></span> <span class="icon-bar"></span> <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="index.html"><i class="fa fa-truck"></i> Delivery 4 U</a>
            </div>
            <div class="collapse navbar-collapse" id="myNavbar">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="register.html"><i class="fa fa-user"></i>
                            Registracija</a></li>
                    <li><a href="login.html"><i class="fa fa-sign-in"></i>
                            Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="jumbotron">
        <div class="container text-center">
            <h1>Delivery 4 U</h1>
            <p>Online servis za pretragu i naručivanje jela i pića</p>
        </div>
    </div>

    <div class="container">
        <h2 style="text-align: center">Login</h2>
        <br />
        <form id="formLogin" class="form-horizontal" method="POST">
            <div class="form-group">
                <label class="control-label col-sm-4" for="username">Username:
                </label>
                <div class="col-sm-4">
                    <input type="text" class="form-control" name="usernameLogin" id="usernameLogin"
                        placeholder="Upišite Vaš username" />
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-4" for="password">Password:
                </label>
                <div class="col-sm-4">
                    <input type="password" class="form-control" name="passwordLogin" id="passwordLogin"
                        placeholder="Upišite Vaš password" />
                </div>
            </div>
            <div class="form-group">
                <div class="col-sm-offset-4 col-sm-4">
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </div>
            </div>
        </form>
        <form class="form-horizontal">
            <div class="form-group">
                <div class="col-sm-offset-4 col-sm-4">
                    <a href="index.html" type="submit" id="cancelButton" class="btn btn-info btn-block">Odustani</a>
                </div>
            </div>
            <div class="col-sm-offset-4 col-sm-4 text-center">
                <a href="register.html">Nemate nalog? Registrujte se ovde.</a>
            </div>
        </form>
    </div>
</body>

</html>
